<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 Money Tracker</h1>
            <p class="subtitle">Track your income and expenses</p>
        </header>

        <div class="summary-cards">
            <div class="card income-card">
                <h3>Total Income</h3>
                <p class="amount" id="totalIncome">$0.00</p>
            </div>
            <div class="card expense-card">
                <h3>Total Expenses</h3>
                <p class="amount" id="totalExpenses">$0.00</p>
            </div>
            <div class="card balance-card">
                <h3>Balance</h3>
                <p class="amount" id="balance">$0.00</p>
            </div>
        </div>

        <div class="transaction-form-container">
            <h2>Add Transaction</h2>
            <form id="transactionForm">
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" placeholder="e.g., Salary, Groceries" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="amount">Amount</label>
                        <input type="number" id="amount" placeholder="0.00" step="0.01" min="0.01" required>
                    </div>

                    <div class="form-group">
                        <label for="type">Type</label>
                        <select id="type" required>
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="salary">Salary</option>
                            <option value="freelance">Freelance</option>
                            <option value="investment">Investment</option>
                            <option value="food">Food</option>
                            <option value="transport">Transport</option>
                            <option value="utilities">Utilities</option>
                            <option value="entertainment">Entertainment</option>
                            <option value="shopping">Shopping</option>
                            <option value="healthcare">Healthcare</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">Add Transaction</button>
            </form>
        </div>

        <div class="transactions-container">
            <div class="transactions-header">
                <h2>Transaction History</h2>
                <div class="filter-controls">
                    <select id="filterType" class="filter-select">
                        <option value="all">All Transactions</option>
                        <option value="income">Income Only</option>
                        <option value="expense">Expenses Only</option>
                    </select>
                    <button id="exportBtn" class="btn btn-secondary">Export CSV</button>
                    <button id="clearBtn" class="btn btn-danger">Clear All</button>
                </div>
            </div>

            <div id="transactionsList" class="transactions-list">
                <p class="empty-state">No transactions yet. Add your first transaction above!</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
